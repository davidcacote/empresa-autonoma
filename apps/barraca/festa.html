<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Festa · Barraca</title>
  <meta name="description" content="Escolha o seu turno e inscreva-se com um toque. Sem contas, sem WhatsApp caótico.">
  <!-- Pré-visualização estática e genérica: a página é estática e o nome da festa só chega depois do carregamento (sem og:image neste ciclo). -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_PT">
  <meta property="og:site_name" content="Barraca">
  <meta property="og:title" content="Escolha o seu turno na festa · Barraca">
  <meta property="og:description" content="Escolha o seu turno e inscreva-se com um toque. Sem contas, sem WhatsApp caótico.">
  <meta property="og:url" content="https://davidcacote.github.io/empresa-autonoma/barraca/festa.html">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="#FBF4E4">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M2 6h28L16 28z' fill='%23C8321E'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/festa.css">
  <script type="module" src="js/festa.js"></script>
</head>
<body>
  <a class="saltar" href="#conteudo">Saltar para os turnos</a>
  <div class="bandeirinhas" aria-hidden="true"></div>

  <header class="contentor cabecalho">
    <a class="cabecalho__marca" href="index.html">Barraca</a>
    <h1 id="titulo" class="cabecalho__titulo">A carregar a festa…</h1>
    <p id="detalhes" class="cabecalho__detalhes"></p>
    <p id="descricao" class="cabecalho__descricao" hidden></p>
    <a id="partilhar" class="botao botao--primario cabecalho__partilhar" target="_blank" rel="noopener" href="#" hidden><svg class="botao__icone" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M12.04 2a9.9 9.9 0 0 0-8.5 14.9L2 22l5.25-1.38A9.9 9.9 0 1 0 12.04 2Zm0 18.1a8.2 8.2 0 0 1-4.18-1.14l-.3-.18-3.1.82.83-3.03-.2-.31a8.2 8.2 0 1 1 6.95 3.84Zm4.5-6.13c-.25-.12-1.46-.72-1.69-.8-.23-.08-.39-.12-.56.12-.16.25-.64.8-.78.97-.14.16-.29.18-.54.06-.25-.12-1.04-.38-1.98-1.22-.73-.65-1.23-1.46-1.37-1.7-.14-.25-.02-.38.1-.5.11-.11.25-.29.37-.43.12-.14.16-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.35-.76-1.85-.2-.48-.41-.42-.56-.43h-.48c-.17 0-.43.06-.66.31-.23.25-.86.84-.86 2.05s.88 2.38 1 2.55c.12.16 1.73 2.64 4.2 3.7.59.26 1.05.41 1.4.52.59.19 1.13.16 1.55.1.47-.07 1.46-.6 1.66-1.17.2-.58.2-1.07.14-1.17-.06-.1-.23-.16-.48-.29Z"/></svg> Partilhar no WhatsApp <span class="so-leitor">(abre o WhatsApp)</span></a>
    <p id="ligacao" class="ligacao">A atualizar…</p>
  </header>

  <main class="contentor" id="principal">
    <div id="aviso" class="aviso aviso--erro" role="alert" hidden></div>
    <div id="confirmacao" class="aviso aviso--sucesso" role="status" tabindex="-1" hidden></div>

    <div id="controlos" hidden>
      <nav id="dias" class="dias" aria-label="Dia da festa"></nav>
      <label class="interruptor">
        <input type="checkbox" id="so-livres" role="switch">
        <span class="interruptor__pista" aria-hidden="true"></span>
        <span>Só vagas livres</span>
      </label>
    </div>

    <div id="conteudo" tabindex="-1"></div>

    <section id="minhas" class="minhas" aria-labelledby="minhas-titulo" hidden>
      <h2 id="minhas-titulo">As minhas inscrições neste dispositivo</h2>
      <ul id="minhas-lista" class="minhas__lista"></ul>
    </section>
  </main>

  <footer class="contentor rodape">
    <p>Feito com a <a href="index.html">Barraca</a> · <a href="criar.html">Criar a minha festa</a></p>
  </footer>

  <dialog id="dlg" class="folha" aria-labelledby="dlg-titulo">
    <form id="form-inscricao" class="folha__corpo" novalidate>
      <h2 id="dlg-titulo" class="folha__titulo">Inscrever-me</h2>
      <p id="dlg-resumo" class="folha__resumo"></p>

      <label class="campo">
        <span class="campo__rotulo">O seu primeiro nome</span>
        <input id="dlg-nome" name="nome" type="text" autocomplete="given-name" maxlength="30" required aria-describedby="dlg-erro">
      </label>

      <label class="caixa">
        <input id="dlg-maior" name="maior" type="checkbox" aria-describedby="dlg-erro">
        <span>Tenho 18 anos ou mais</span>
      </label>

      <p id="dlg-erro" class="erro-campo" role="alert"></p>

      <div class="folha__acoes">
        <button type="button" id="dlg-cancelar" class="botao botao--secundario">Cancelar</button>
        <button type="submit" id="dlg-confirmar" class="botao botao--primario">Confirmar</button>
      </div>
    </form>
  </dialog>
</body>
</html>
