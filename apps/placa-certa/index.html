<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Placa Certa · Cartazes para o seu negócio</title>
  <meta name="description" content="Crie e imprima em A4 uma placa para a porta: aberto/fechado, horário, preços ou aviso. Sem conta, sem registo.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='4' width='24' height='24' rx='3' fill='%23111'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles/app.css">
  <link rel="stylesheet" href="styles/print.css" media="print">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="cabeca">
    <h1>Placa Certa</h1>
    <p>Escolha o modelo, escreva o texto e imprima em A4. Sem conta, sem registo.</p>
  </header>
  <main class="area">
    <section class="editor" aria-labelledby="t-editor">
      <h2 id="t-editor">O seu cartaz</h2>
      <div class="campo">
        <label for="modelo">Modelo</label>
        <select id="modelo" name="modelo"></select>
      </div>
      <form id="campos" onsubmit="return false"></form>
      <button type="button" id="imprimir" class="botao">Imprimir</button>
    </section>
    <section class="previa" aria-labelledby="t-previa">
      <h2 id="t-previa">Pré-visualização (A4)</h2>
      <div class="papel"><div id="folha" class="folha" role="img" aria-label="Pré-visualização do cartaz" aria-live="polite"></div></div>
    </section>
  </main>
</body>
</html>
